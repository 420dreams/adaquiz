<!doctype html>
<html lang="fr">
  
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AdaQuiz</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  
<body>
     <header>
          <p class="logo">AdaQuiz</p>
     </header>

  <!-- ═══════════════════════════════════════
       ÉCRAN 1 — ACCUEIL
       Affiché au départ. Caché quand on clique sur "Commencer".
  ════════════════════════════════════════ -->
    
  <section id="ecran-accueil" class="ecran">
     <img src="" alt="">
     <h1>Quiz HTML</h1>
     <p>Teste tes connaissances en HTML !</p>
     <button id="btn-commencer">Commencer</button>
  </section>
    
  <!-- ═══════════════════════════════════════
       ÉCRAN 2 — QUESTION
       Caché au départ. Affiché pendant le quiz.
  ════════════════════════════════════════ -->
    
    <section id="ecran-question" class="ecran cache">
  
      <main>
        <h2>Question 1/12</h2>
        <article>
          <img src="" alt="" />
          <p>question</p>
        </article>
        <article class="reponse">
          <ul>
            <label for="">
              <input type="checkbox" />
              Reponse A
            </label>

            <label for="">
              <input type="checkbox" />
              Reponse B
            </label>

            <label for="">
              <input type="checkbox" />
              Reponse C
            </label>

            <label for="">
              <input type="checkbox" />
              Reponse D
            </label>
          </ul>
        </article>
        <button>valider</button>
      </main>
    </section>
  <!-- ═══════════════════════════════════════
       ÉCRAN 3 — RÉSULTATS
       Caché au départ. Affiché à la fin du quiz.
  ════════════════════════════════════════ -->
  <section id="ecran-resultats" class="ecran cache">
      <h2 id="score">7 / 10</h2>
     <p id="message">Bien joué ! Tu connais bien le HTML</p>
     <img src="" alt="">
     <button id="btn-rejouer">Rejouer</button>

  </section>
  <footer>
     <p>Merci d'avoir jouer</p>
  </footer>
  <script src="script.js" defer></script>
 
</body>

</html>
